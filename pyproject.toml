[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptes"
version = "0.1.0"
description = "Panoptes — universal agent observability, audit trail, and policy enforcement for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Miggy", email = "miguel@throttlai.com"}
]
keywords = ["agent", "ai", "audit", "security", "observability", "claude-code", "codex", "hermes", "antigravity", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.scripts]
panoptes = "panoptes.cli:main"

[tool.setuptools.packages.find]
include = ["panoptes*"]
