[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptes-observe"
version = "0.1.0"
description = "Adapter-based agent observability, local audit trails, and policy gates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Miggy", email = "miguel@throttlai.com"}
]
keywords = ["agent", "ai", "audit", "security", "observability", "claude-code", "codex", "hermes", "antigravity", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
release = [
    "build>=1.2,<2",
    "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/miggy-code/Panoptes"
Repository = "https://github.com/miggy-code/Panoptes"
Issues = "https://github.com/miggy-code/Panoptes/issues"
Changelog = "https://github.com/miggy-code/Panoptes/blob/main/CHANGELOG.md"
Security = "https://github.com/miggy-code/Panoptes/security/policy"

[project.scripts]
panoptes = "panoptes.cli:main"

[tool.setuptools.packages.find]
include = ["panoptes*"]

[tool.setuptools.package-data]
panoptes = ["default_policies/*.yaml"]
