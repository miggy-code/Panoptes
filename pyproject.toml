[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptes-observe"
version = "0.3.0"
description = "Adapter-based agent observability and local audit trails."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Miggy", email = "miguel@throttlai.com"}
]
keywords = ["agent", "ai", "audit", "security", "observability", "claude-code", "codex", "hermes", "antigravity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
proxy = [
    "httpx>=0.27,<1",
]
otel = [
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/miggy-code/Panoptes"
Repository = "https://github.com/miggy-code/Panoptes"
Issues = "https://github.com/miggy-code/Panoptes/issues"
Changelog = "https://github.com/miggy-code/Panoptes/blob/main/CHANGELOG.md"
Security = "https://github.com/miggy-code/Panoptes/security/policy"

[project.scripts]
panoptes = "panoptes.cli:main"

[tool.setuptools.packages.find]
include = ["panoptes*"]

[tool.setuptools.package-data]
panoptes = ["py.typed"]

[dependency-groups]
# Contributor tooling (PEP 735). `uv sync` installs `dev` by default; with pip,
# use `pip install -e ".[proxy,otel]" --group dev` (pip 25.1 or newer).
dev = [
    "pytest>=8,<9",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "httpx>=0.27,<1",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
release = [
    "twine>=6,<7",
]

[tool.ruff]
target-version = "py310"
line-length = 88
# Doc code blocks are hand-aligned fragments, not formatter input.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.mypy]
python_version = "3.10"
files = ["panoptes"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
