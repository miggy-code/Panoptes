name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # No dependency cache here: a release builds from a clean slate.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(uv version --short --frozen)
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

      - name: Build and validate distributions
        run: |
          uv build
          uv run --group release twine check --strict dist/*

      - name: Smoke-test installed wheel
        run: |
          uv venv --seed /tmp/panoptes-release-wheel
          /tmp/panoptes-release-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/panoptes-release-wheel/bin/panoptes --version
          /tmp/panoptes-release-wheel/bin/python -c "from importlib.metadata import version; assert version('panoptes-observe')"
          /tmp/panoptes-release-wheel/bin/python -c "from importlib.resources import files; assert files('panoptes').joinpath('py.typed').is_file()"
          /tmp/panoptes-release-wheel/bin/pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
          cp "$GITHUB_WORKSPACE/tests/test_request_capture.py" /tmp/test_panoptes_request_capture.py
          /tmp/panoptes-release-wheel/bin/python -m pytest -q /tmp/test_panoptes_request_capture.py

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/panoptes-observe
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
