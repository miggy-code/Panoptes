name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Install test and release tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,release]"

      - name: Test
        run: |
          python -m pip check
          python -m pytest -q

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/panoptes-release-wheel
          /tmp/panoptes-release-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/panoptes-release-wheel/bin/panoptes --version
          /tmp/panoptes-release-wheel/bin/python -c "from importlib.metadata import version; assert version('panoptes-observe')"
          /tmp/panoptes-release-wheel/bin/python -c "from importlib.resources import files; assert files('panoptes').joinpath('default_policies/no-prod-access.yaml').is_file()"

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/panoptes-observe
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
