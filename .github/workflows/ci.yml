name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: |
          python -m pip check
          python -m pytest -q

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: python -m pip install build && python -m build --wheel

      - name: Smoke-test wheel contents
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/panoptes-wheel
          /tmp/panoptes-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/panoptes-wheel/bin/python -c "from importlib.resources import files; assert files('panoptes').joinpath('default_policies/no-prod-access.yaml').is_file()"
