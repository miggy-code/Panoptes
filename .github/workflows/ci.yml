name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

      - name: Build and validate distributions
        if: matrix.python-version == '3.12'
        run: |
          uv build
          uv run --group release twine check --strict dist/*

      # Install the wheel with plain pip, the way users do, outside the repo.
      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.12'
        run: |
          uv venv --seed /tmp/panoptes-wheel
          /tmp/panoptes-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/panoptes-wheel/bin/panoptes --version
          /tmp/panoptes-wheel/bin/python -c "from importlib.metadata import version; assert version('panoptes-observe')"
          /tmp/panoptes-wheel/bin/python -c "from importlib.resources import files; assert files('panoptes').joinpath('py.typed').is_file()"
          /tmp/panoptes-wheel/bin/pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
          cp "$GITHUB_WORKSPACE/tests/test_request_capture.py" /tmp/test_panoptes_request_capture.py
          /tmp/panoptes-wheel/bin/python -m pytest -q /tmp/test_panoptes_request_capture.py
